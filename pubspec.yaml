name: ersschool
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.9.2
  image_picker: ^1.1.2
  google_fonts: ^8.1.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/loginscreenlogo.png
    - assets/images/student_profile.png
    - assets/images/student_welcome.png
    - assets/animations/ers_animation.mp4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/applogo.png"
