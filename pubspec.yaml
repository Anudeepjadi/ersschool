name: ersschool
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.9.2
  image_picker: ^1.1.2
  google_fonts: ^8.1.0
  fl_chart: ^0.69.0
  shared_preferences: ^2.5.5
  pdf: ^3.12.0
  printing: ^5.14.3
  url_launcher: ^6.3.2
  intl: ^0.20.3
  file_picker: ^11.0.2
  path_provider: ^2.1.6
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/loginscreenlogo.png
    - assets/images/student_profile.png
    - assets/images/student_welcome.png
    - assets/images/school_bus.png
    - assets/animations/ers_animation.mp4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/applogo.png"
